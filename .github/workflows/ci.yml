name: CI

on:
  pull_request:
    branches: [main, testing, development]
  push:
    branches: [main, testing, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Test - Unit (Jest)
        run: npx jest --ci --coverage=false

  # Known gap: nothing here starts the backend or the frontend for Playwright to drive,
  # so e2e/ only has a placeholder spec for now. Non-blocking (continue-on-error) so it
  # isn't part of the required status check for branch protection.
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Test - E2E (Playwright)
        run: npm run e2e
