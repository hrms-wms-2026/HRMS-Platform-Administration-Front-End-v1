@if (crumb(); as c) {
  <nav aria-label="Breadcrumb" class="breadcrumb-nav">
    @if (c.section) {
      <span>{{ c.section }}</span>
      <span aria-hidden="true">/</span>
    }
    @if (c.parent) {
      <a [routerLink]="c.parent.route" class="hover:text-slate-700 hover:underline dark:hover:text-slate-200">{{ c.parent.label }}</a>
      <span aria-hidden="true">/</span>
    }
    <span class="breadcrumb-current">{{ c.page }}</span>
  </nav>
}
