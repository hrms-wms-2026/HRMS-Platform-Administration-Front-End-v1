<div class="relative">
  <button
    type="button"
    aria-label="Notifications"
    (click)="toggleOpen()"
    class="relative rounded-lg p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
      ></path>
    </svg>
    @if (unreadCount() > 0) {
      <span
        class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-600 px-1 text-[10px] font-semibold leading-none text-white"
      >
        {{ unreadCount() > 99 ? '99+' : unreadCount() }}
      </span>
    }
  </button>

  @if (open()) {
    <div
      class="absolute right-0 z-40 mt-2 w-80 rounded-xl border border-slate-200 bg-white shadow-lg dark:border-slate-700 dark:bg-slate-900"
    >
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 px-3 py-2">
        <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">Notifications</p>
        @if (unreadCount() > 0) {
          <button
            type="button"
            (click)="markAllRead()"
            class="text-xs font-medium text-indigo-600 hover:text-indigo-700 dark:text-indigo-400"
          >
            Mark all read
          </button>
        }
      </div>

      <div class="max-h-96 overflow-y-auto">
        @if (loading()) {
          <p class="px-3 py-4 text-center text-sm text-slate-500 dark:text-slate-400">Loading…</p>
        } @else if (items().length === 0) {
          <p class="px-3 py-4 text-center text-sm text-slate-500 dark:text-slate-400">No notifications yet.</p>
        } @else {
          @for (item of items(); track item.id) {
            <button
              type="button"
              (click)="markRead(item)"
              class="flex w-full flex-col gap-0.5 border-b border-slate-50 dark:border-slate-800 px-3 py-2.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800"
            >
              <span class="flex items-center gap-2">
                @if (!item.isRead) {
                  <span class="h-1.5 w-1.5 flex-shrink-0 rounded-full bg-indigo-600"></span>
                }
                <span class="truncate text-sm font-medium text-slate-900 dark:text-slate-100">{{ item.title }}</span>
              </span>
              <span class="line-clamp-2 text-xs text-slate-500 dark:text-slate-400">{{ item.body }}</span>
              <span class="text-[11px] text-slate-400 dark:text-slate-500">{{ item.createdAt | date: 'medium' }}</span>
            </button>
          }
        }
      </div>
    </div>
  }
</div>
