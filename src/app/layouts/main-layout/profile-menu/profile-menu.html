<div class="relative">
  <button
    type="button"
    data-profile-avatar
    (click)="toggleOpen()"
    class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700 hover:bg-blue-200 dark:bg-blue-900 dark:text-blue-200 dark:hover:bg-blue-800"
  >
    {{ initials() }}
  </button>

  @if (open()) {
    <div class="absolute right-0 z-40 mt-2 w-64 rounded-xl border border-slate-200 bg-white p-2 shadow-lg dark:border-slate-700 dark:bg-slate-900">
      @if (currentUser(); as user) {
        <div class="flex items-center gap-3 rounded-lg p-2">
          <span
            class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-semibold text-blue-700 dark:bg-blue-900 dark:text-blue-200"
          >
            {{ initials() }}
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-slate-900 dark:text-slate-100">{{ user.email }}</p>
            <app-status-badge [label]="user.platformRole" tone="indigo" />
          </div>
        </div>
        <hr class="my-2 border-slate-100 dark:border-slate-800" />
      }
      <a
        routerLink="/settings/mfa"
        data-profile-settings-link
        (click)="closeMenu()"
        class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        Settings
      </a>
      <button
        type="button"
        data-theme-toggle
        (click)="themeService.toggle()"
        class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        <span>Dark Mode</span>
        <span
          class="relative inline-flex h-5 w-9 flex-shrink-0 items-center rounded-full transition-colors"
          [class.bg-indigo-600]="themeService.theme() === 'dark'"
          [class.bg-slate-200]="themeService.theme() !== 'dark'"
          [class.dark:bg-slate-700]="themeService.theme() !== 'dark'"
        >
          <span
            class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
            [class.translate-x-4]="themeService.theme() === 'dark'"
            [class.translate-x-0.5]="themeService.theme() !== 'dark'"
          ></span>
        </span>
      </button>
      <hr class="my-2 border-slate-100 dark:border-slate-800" />
      <button
        type="button"
        data-profile-logout
        (click)="onLogoutClicked()"
        class="block w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-800"
      >
        Logout
      </button>
    </div>
  }
</div>

@if (showLogoutConfirm()) {
  <app-logout-confirm-modal
    [email]="currentUser()?.email ?? null"
    [platformRole]="currentUser()?.platformRole ?? null"
    (confirmed)="onLogoutConfirmed()"
    (cancelled)="onLogoutCancelled()"
  />
}
