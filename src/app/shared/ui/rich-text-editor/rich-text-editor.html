<div class="rounded-lg border border-slate-300 dark:border-slate-600" [class.opacity-60]="disabled()">
  <div class="relative flex flex-wrap gap-1 border-b border-slate-200 dark:border-slate-700 p-1.5">
    @for (button of toolbarButtons; track button.command) {
      <button
        type="button"
        [title]="button.label"
        [attr.aria-label]="button.label"
        [disabled]="disabled()"
        (mousedown)="$event.preventDefault()"
        (click)="runCommand(button.command)"
        class="rounded px-2 py-1 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:cursor-not-allowed"
      >
        {{ button.icon }}
      </button>
    }
    <button
      type="button"
      title="Bulleted list"
      aria-label="Bulleted list"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="runCommand('insertUnorderedList')"
      class="rounded p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:cursor-not-allowed"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12M8.25 17.25h12" />
        <path stroke-linecap="round" d="M4 6.75h.008M4 12h.008M4 17.25h.008" stroke-width="2.5" />
      </svg>
    </button>
    <button
      type="button"
      title="Numbered list"
      aria-label="Numbered list"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="runCommand('insertOrderedList')"
      class="rounded p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:cursor-not-allowed"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 6.75h10.5M9.75 12h10.5M9.75 17.25h10.5" />
        <text x="2.5" y="8.6" font-size="6" fill="currentColor" stroke="none" font-family="sans-serif">1</text>
        <text x="2.5" y="13.85" font-size="6" fill="currentColor" stroke="none" font-family="sans-serif">2</text>
        <text x="2.5" y="19.1" font-size="6" fill="currentColor" stroke="none" font-family="sans-serif">3</text>
      </svg>
    </button>
    <button
      type="button"
      title="Insert link"
      aria-label="Insert link"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="insertLink()"
      class="rounded p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:cursor-not-allowed"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" />
      </svg>
    </button>
    <button
      type="button"
      title="Insert image"
      aria-label="Insert image"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="insertImage()"
      class="rounded p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:cursor-not-allowed"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M3.75 19.5h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Z" />
        <path stroke-linecap="round" d="M8.25 8.25h.008" stroke-width="2.5" />
      </svg>
    </button>
    <button
      type="button"
      title="Insert emoji"
      aria-label="Insert emoji"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="toggleEmojiPicker()"
      class="rounded p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:cursor-not-allowed"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 15.182a4.5 4.5 0 0 1-6.364 0M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        <path stroke-linecap="round" d="M9 9.75h.008M15 9.75h.008" stroke-width="2.5" />
      </svg>
    </button>

    @if (activePanel() === 'emoji') {
      <div class="absolute left-0 top-full z-10 mt-1 grid grid-cols-8 gap-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-2 shadow-lg">
        @for (emoji of emojis; track emoji) {
          <button
            type="button"
            [attr.aria-label]="'Insert ' + emoji"
            (mousedown)="$event.preventDefault()"
            (click)="insertEmoji(emoji)"
            class="rounded p-1 text-lg hover:bg-slate-100 dark:hover:bg-slate-800"
          >
            {{ emoji }}
          </button>
        }
      </div>
    }
  </div>
  @if (activePanel() === 'link' || activePanel() === 'image') {
    <div class="flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 p-2">
      <input
        #promptInput
        type="url"
        [placeholder]="activePanel() === 'link' ? 'https://example.com' : 'https://example.com/image.png'"
        [ngModel]="promptValue()"
        (ngModelChange)="promptValue.set($event)"
        (keydown.enter)="confirmPrompt()"
        (keydown.escape)="cancelPrompt()"
        class="flex-1 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-2 py-1 text-xs text-slate-900 dark:text-slate-100"
      />
      <button
        type="button"
        (click)="confirmPrompt()"
        class="rounded bg-indigo-600 px-2 py-1 text-xs font-semibold text-white hover:bg-indigo-700"
      >
        {{ activePanel() === 'link' ? 'Add Link' : 'Add Image' }}
      </button>
      <button
        type="button"
        (click)="cancelPrompt()"
        class="rounded px-2 py-1 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
      >
        Cancel
      </button>
    </div>
  }
  <div
    #editable
    role="textbox"
    aria-multiline="true"
    aria-label="Announcement body"
    [attr.contenteditable]="!disabled()"
    (input)="onInput()"
    (blur)="onBlur()"
    class="min-h-[120px] px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:outline-none [&_a]:text-indigo-600 [&_a]:underline [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:list-decimal [&_ol]:pl-5 [&_img]:max-w-full"
  ></div>
</div>
