<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <label for="tenantName" class="audit-filter-label">Company Name</label>
      <input id="tenantName" type="text" formControlName="name" class="audit-filter-input" />
    </div>
    <div>
      <label for="tenantSlug" class="audit-filter-label">Slug</label>
      <input id="tenantSlug" type="text" formControlName="slug" class="audit-filter-input" />
    </div>
    <div class="lg:col-span-2">
      <label for="tenantIndustry" class="audit-filter-label">Industry</label>
      <select id="tenantIndustry" formControlName="industryProfile" class="audit-filter-input">
        @for (option of industryOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <p class="text-xs text-slate-500">
    Draft fields can only be edited while the tenant is in provisioning status.
  </p>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4 dark:border-slate-800">
    <app-button label="Cancel" variant="secondary" type="button" (clicked)="cancelled.emit()" />
    <app-button label="Save Changes" variant="indigo" type="submit" [loading]="saving()" />
  </div>
</form>
