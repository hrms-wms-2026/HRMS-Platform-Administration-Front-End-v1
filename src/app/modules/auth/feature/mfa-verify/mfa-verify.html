<div class="w-full max-w-md rounded-2xl bg-white p-10 shadow-2xl">
  <div class="mb-8 text-center">
    <div class="flex items-center justify-center">
      <img src="onexso-logo-text.svg" alt="ONEXSO" class="h-7 w-auto" />
    </div>
    <p class="mt-1 text-sm font-medium text-slate-500">Two-Factor Verification</p>
  </div>

  <form class="flex flex-col gap-5" [formGroup]="codeForm" (ngSubmit)="submit()" novalidate>
    @if (errorMessage()) {
      <div
        class="flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700"
        role="alert"
      >
        {{ errorMessage() }}
      </div>
    }

    <div>
      <label for="code" class="mb-1.5 block text-sm font-medium text-slate-700">
        Enter the 6-digit code from your authenticator app
      </label>
      <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        formControlName="code"
        placeholder="123456"
        class="w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-lg tracking-[0.5em] text-slate-900 placeholder:tracking-normal placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/30"
      />
    </div>

    <app-button
      type="submit"
      label="Verify"
      loadingText="Verifying…"
      [loading]="loading()"
      [disabled]="codeForm.invalid"
      [fullWidth]="true"
    />
  </form>
</div>
