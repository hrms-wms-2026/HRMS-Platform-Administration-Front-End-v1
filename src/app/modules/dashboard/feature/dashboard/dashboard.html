<div class="flex flex-col gap-6">
  <div class="rounded-2xl bg-white dark:bg-slate-900 p-8 shadow-sm">
    @if (currentUser(); as user) {
      <h1 class="page-title">Welcome back, {{ user.email }}</h1>
      <p class="page-subtitle">
        Signed in as <span class="font-medium text-slate-700 dark:text-slate-300">{{ user.platformRole }}</span>
      </p>
    } @else {
      <h1 class="page-title">Welcome back</h1>
    }
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <a
      routerLink="/settings/mfa"
      class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-5 shadow-sm transition hover:border-blue-300 hover:shadow-md"
    >
      <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">Security</p>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Manage two-factor authentication for your account.</p>
    </a>
  </div>
</div>
