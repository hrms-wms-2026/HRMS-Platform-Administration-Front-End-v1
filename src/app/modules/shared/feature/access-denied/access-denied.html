<div class="flex items-center justify-center min-h-[75vh] px-4">
  <div class="w-full max-w-lg rounded-3xl bg-white dark:bg-slate-900 p-12 text-center shadow-[0_10px_40px_-10px_rgba(0,0,0,0.06)] border border-slate-100/80">
    <!-- Premium Illustration Container -->
    <div class="relative mx-auto mb-8 flex h-48 w-48 items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-full h-full">
        <!-- Background Dashed Circle -->
        <circle
          cx="100"
          cy="95"
          r="65"
          fill="none"
          stroke="#dbeafe"
          stroke-width="1.5"
          stroke-dasharray="4 4"
        />

        <!-- Decorative elements: crosses and dots -->
        <!-- Top Left Cross -->
        <path d="M 45 50 L 53 50 M 49 46 L 49 54" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round" />
        <!-- Top Right Cross -->
        <path d="M 152 55 L 160 55 M 156 51 L 156 59" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round" />
        <!-- Bottom Left Cross -->
        <path d="M 46 132 L 54 132 M 50 128 L 50 136" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round" />
        <!-- Bottom Right Cross/Dot -->
        <path d="M 150 126 L 158 126 M 154 122 L 154 130" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round" />

        <!-- Ellipse Shadow under the shield -->
        <ellipse cx="100" cy="164" rx="28" ry="4" fill="#e2e8f0" opacity="0.7" />

        <!-- Shield Outer Glow / Border -->
        <path
          d="M 100 45 C 128 45, 138 39, 138 39 C 138 90, 126 128, 100 156 C 74 128, 62 90, 62 39 C 62 39, 72 45, 100 45 Z"
          fill="#eff6ff"
          stroke="#bfdbfe"
          stroke-width="1.5"
        />

        <!-- Shield Inner Path (Double Border style) -->
        <path
          d="M 100 51 C 124 51, 132 46, 132 46 C 132 88, 121 122, 100 148 C 79 122, 68 88, 68 46 C 68 46, 76 51, 100 51 Z"
          fill="none"
          stroke="#60a5fa"
          stroke-width="1"
          stroke-dasharray="2 2"
        />

        <!-- Lock Icon Group inside the shield -->
        <g transform="translate(85, 75)">
          <!-- Shackle -->
          <path
            d="M 6 12 V 9 C 6 4, 11 0, 15 0 C 19 0, 24 4, 24 9 V 12"
            fill="none"
            stroke="#2563eb"
            stroke-width="3"
            stroke-linecap="round"
          />
          <!-- Lock Body -->
          <rect x="0" y="11" width="30" height="24" rx="6" fill="#2563eb" />
          <!-- Keyhole -->
          <circle cx="15" cy="20" r="2.5" fill="#ffffff" />
          <path d="M 15 22.5 L 15 27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        </g>
      </svg>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100 mb-3">Access Restricted</h1>
    <p class="text-base text-slate-500 dark:text-slate-400 leading-relaxed max-w-sm mx-auto mb-8">
      You don't have permission to view this page. If you believe this is a mistake, contact your administrator.
    </p>

    <!-- Button Action -->
    <div>
      <app-button label="Go to Dashboard" (clicked)="goToDashboard()" />
    </div>
  </div>
</div>
