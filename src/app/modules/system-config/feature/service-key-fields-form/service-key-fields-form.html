<div class="flex flex-col gap-4" [formGroup]="group()">
  @for (field of fields(); track field.name) {
    <div>
      <label
        [for]="idPrefix() + '-' + field.name"
        class="text-sm font-medium text-slate-700 dark:text-slate-300"
      >
        {{ field.label }}{{ field.required ? '' : ' (optional)' }}
      </label>

      @if (field.kind === 'select') {
        <select
          [id]="idPrefix() + '-' + field.name"
          [formControlName]="field.name"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/30"
        >
          @for (option of field.options; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      } @else {
        <input
          [id]="idPrefix() + '-' + field.name"
          [type]="inputType(field)"
          [formControlName]="field.name"
          [attr.placeholder]="field.placeholder"
          [attr.autocomplete]="field.kind === 'secret' ? 'new-password' : 'off'"
          spellcheck="false"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 dark:text-slate-100 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/30"
          [class.font-mono]="field.kind !== 'url'"
        />
      }
    </div>
  }
</div>
