<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
  <div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-900 p-8 shadow-2xl">
    <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100">Rotate Credentials</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
      <p class="text-sm text-slate-600 dark:text-slate-300">
        Rotate credentials for <span class="font-medium">{{ gateway().displayName }}</span>
        ({{ gateway().gatewayKey }}). Previous credentials will be deactivated.
      </p>

      @if (errorMessage(); as message) {
        <p class="text-sm text-red-700">{{ message }}</p>
      }

      <div>
        <label for="rotateSecretKey" class="audit-filter-label">New Secret Key</label>
        <input id="rotateSecretKey" type="password" formControlName="secretKey" class="audit-filter-input" autocomplete="new-password" />
      </div>

      <div>
        <label for="rotateWebhookSecret" class="audit-filter-label">New Webhook Secret (optional)</label>
        <input id="rotateWebhookSecret" type="password" formControlName="webhookSecret" class="audit-filter-input" autocomplete="new-password" />
      </div>

      <div class="flex justify-end gap-2">
        <app-button label="Cancel" variant="secondary" type="button" (clicked)="cancel()" />
        <app-button label="Rotate Credentials" variant="indigo" type="submit" [loading]="loading()" />
      </div>
    </form>
  </div>
</div>
